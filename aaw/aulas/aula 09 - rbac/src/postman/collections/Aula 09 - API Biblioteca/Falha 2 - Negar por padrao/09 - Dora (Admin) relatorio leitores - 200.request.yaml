$kind: http-request
name: '09 - Dora (Admin) relatório de leitores → 200'
method: GET
url: '{{baseUrl}}/api/relatorios/leitores'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{tokenDora}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 - Admin pode acessar relatorios', () => pm.response.to.have.status(200));
