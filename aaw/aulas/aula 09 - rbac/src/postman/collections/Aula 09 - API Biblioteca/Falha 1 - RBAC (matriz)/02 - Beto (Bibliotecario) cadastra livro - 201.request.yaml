$kind: http-request
name: '02 - Beto (Bibliotecario) cadastra livro → 201'
method: POST
url: '{{baseUrl}}/api/livros'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{tokenBeto}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "titulo": "Livro de Teste",
      "autor": "Fulano",
      "ano": 2024,
      "disponivel": true,
      "categoria": "Comum"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 - Bibliotecario pode cadastrar livro', () => pm.response.to.have.status(201));
